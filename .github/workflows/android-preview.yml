name: Build Readest Preview APK
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, tag or branch of steinerme/readest to build
        required: true
        default: preview
permissions:
  contents: read
concurrency:
  group: android-preview
  cancel-in-progress: false
env:
  SOURCE_REPO: steinerme/readest
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  # Fast gate (~3-4 min): type check, the reading/reflow regression tests and
  # the reflow golden pages. The APK job only starts when this passes, so a
  # broken change fails in minutes instead of after a 20 minute build.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.src.outputs.sha }}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - id: src
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Load build submodules and the PDF text bridge
        working-directory: source
        run: |
          # tauri-plugin-turso supplies TypeScript types the app imports.
          git submodule update --init --recursive packages/foliate-js packages/simplecc-wasm packages/js-mdict apps/readest-app/src-tauri/plugins/tauri-plugin-turso
          git -C packages/foliate-js apply --check ../../../foliate-reflow.patch
          git -C packages/foliate-js apply ../../../foliate-reflow.patch
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install locked dependencies and reading assets
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @readest/readest-app setup-vendors
      - name: Type check
        working-directory: source
        run: node node_modules/typescript/lib/tsc.js --noEmit -p apps/readest-app/tsconfig.json
      - name: Decrypt the real-PDF reflow test set
        env:
          REFLOW_CORPUS_KEY: ${{ secrets.REFLOW_CORPUS_KEY }}
        run: |
          # 34 real pages kept encrypted in this public repository. The
          # preview build must pass them, so a missing key fails the build.
          test -n "$REFLOW_CORPUS_KEY" && test -f reflow-corpus.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in reflow-corpus.enc \
            -out "$RUNNER_TEMP/reflow-corpus.pdf" -pass env:REFLOW_CORPUS_KEY
          echo "5edab0f13437b5acdea4cbfa89b1499ce10b303a59b0d55ede343b21375d9c73  $RUNNER_TEMP/reflow-corpus.pdf" | sha256sum -c
          echo "REFLOW_CORPUS_PDF=$RUNNER_TEMP/reflow-corpus.pdf" >> "$GITHUB_ENV"
      - name: Reading, reflow and AI regression tests
        working-directory: source/apps/readest-app
        run: >-
          pnpm test --run --maxWorkers=3
          src/__tests__/ai/
          src/__tests__/utils/pdfReflow*.test.ts
          src/__tests__/styles/pdf-reflow-inline-equation.test.ts
          src/__tests__/utils/pdfRendererPage.test.ts
          src/__tests__/utils/debugSelection.test.ts
          src/__tests__/foliate-pdf-reflow.test.ts
          src/__tests__/document/pdf-tts.test.ts
          src/__tests__/document/pdf-reflow-speech.test.ts
          src/__tests__/services/tts-controller*.test.ts
          src/__tests__/services/tts-word-highlight.test.ts
          src/__tests__/services/tts-inline-annotations.test.ts
          src/__tests__/hooks/usePdfReflowTTS.test.tsx
          src/__tests__/hooks/useTTSControl.test.tsx
          src/__tests__/hooks/useReflowSelectionMenu.test.tsx
          src/__tests__/hooks/useReflowOverflowHints.test.tsx
          src/__tests__/hooks/useAppUrlIngress-debug.test.ts
          src/__tests__/components/pdf-default-reflow.test.tsx
          src/__tests__/components/HeaderBar.test.tsx
          src/__tests__/components/PdfReflowDialog.test.tsx
          src/__tests__/components/PdfReflowFigure.test.tsx
          src/__tests__/components/tts/
          src/__tests__/components/pdf-shared-footer.test.tsx
          src/__tests__/components/pdf-reflow-bookmark.test.tsx
          src/__tests__/components/page-jump-input.test.tsx
          src/__tests__/components/font-layout-panel.test.tsx
          src/__tests__/components/annotator/AnnotatorLookupSurfaces.test.tsx
          src/__tests__/app/reader/hooks/usePagination-mediaTap.test.ts
          src/__tests__/components/reading-assistant-panel.test.tsx
          src/__tests__/components/reading-assistant-host.test.tsx
          src/__tests__/components/reading-ai-entry.test.tsx
          src/__tests__/components/reading-floating-dock.test.tsx
          src/__tests__/components/tts-mini-player-position.test.ts
          src/__tests__/components/settings-overscroll.test.tsx
          src/__tests__/components/codex-oauth-settings.test.tsx
          src/__tests__/components/command-palette-back.test.tsx
          src/__tests__/helpers/settings.test.ts

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      NODE_OPTIONS: --max-old-space-size=10240
      NEXT_PUBLIC_PREVIEW_DEBUG_LINKS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the exact commit that passed checks
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.checks.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Load build submodules and the PDF text bridge
        working-directory: source
        run: |
          git submodule update --init --recursive packages/foliate-js packages/tauri packages/simplecc-wasm packages/qcms packages/js-mdict apps/readest-app/src-tauri/plugins/tauri-plugin-turso apps/readest-app/src-tauri/plugins/tauri-plugin-webview-upgrade
          git -C packages/foliate-js apply --check ../../../foliate-reflow.patch
          git -C packages/foliate-js apply ../../../foliate-reflow.patch
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      # Gradle distribution + dependency + build caches (Gradle step was ~4 min
      # including a fresh distribution download every run).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source -> target
          key: android-preview-arm64
      # Next/webpack persistent cache (the web build was a cold 3 min every run:
      # "No build cache found").
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: source/apps/readest-app/.next/cache
          key: next-${{ hashFiles('source/pnpm-lock.yaml') }}-${{ needs.checks.outputs.sha }}
          restore-keys: |
            next-${{ hashFiles('source/pnpm-lock.yaml') }}-
      - name: Install locked dependencies and reading assets
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @readest/readest-app setup-vendors
      - name: Load private custom branding
        env:
          PREVIEW_BRANDING_PASSWORD: ${{ secrets.PREVIEW_BRANDING_PASSWORD }}
        run: |
          test -n "$PREVIEW_BRANDING_PASSWORD"
          mkdir -p branding
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in branding.enc -out "$RUNNER_TEMP/branding.tar" -pass env:PREVIEW_BRANDING_PASSWORD
          tar -xf "$RUNNER_TEMP/branding.tar" -C branding
          rm -f "$RUNNER_TEMP/branding.tar"
          python3 -m pip install Pillow
      - name: Regenerate Android scaffolding and restore upstream customizations
        working-directory: source/apps/readest-app
        run: |
          rm -rf src-tauri/gen/android
          pnpm tauri android init --ci
          git restore -- src-tauri/gen/android
          # tauri icon writes directly into gen/android when it exists.
          # Generate AFTER restore; icons/android still contains upstream art.
          pnpm tauri icon ../../../branding/icon.json
      - name: Configure separate preview app
        run: python3 prepare_preview.py
      - name: Load private preview signing key
        env:
          PREVIEW_KEYSTORE: ${{ secrets.PREVIEW_KEYSTORE }}
          PREVIEW_KEY_PASSWORD: ${{ secrets.PREVIEW_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'preview.jks'
          key.write_bytes(base64.b64decode(os.environ['PREVIEW_KEYSTORE']))
          key.chmod(0o600)
          props = Path('source/apps/readest-app/src-tauri/gen/android/keystore.properties')
          props.write_text('keyAlias=preview\npassword=' + os.environ['PREVIEW_KEY_PASSWORD'] + '\nstoreFile=' + str(key) + '\n')
          props.chmod(0o600)
          PY
      - name: Build signed optimized ARM64 APK
        working-directory: source/apps/readest-app
        run: pnpm tauri android build --target aarch64 --apk --ci
      - name: Verify package identity and signature
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          files = list(Path('source/apps/readest-app/src-tauri/gen/android/app/build/outputs/apk').rglob('*.apk'))
          files = [p for p in files if 'unsigned' not in p.name and 'release' in p.name]
          assert len(files) == 1, files
          shutil.copy2(files[0], 'artifacts/Readest-Preview-arm64.apk')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs artifacts/Readest-Preview-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/Readest-Preview-arm64.apk > artifacts/package-info.txt
          python3 - <<'PY'
          from pathlib import Path
          info = Path('artifacts/package-info.txt').read_text()
          assert "package: name='com.bilingify.readest.preview'" in info
          assert "native-code: 'arm64-v8a'" in info
          PY
          # Decode the final signed APK and compare packaged launcher pixels.
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar -o "$RUNNER_TEMP/apktool.jar"
          echo 'effb69dab2f93806cafc0d232f6be32c2551b8d51c67650f575e46c016908fdd  '"$RUNNER_TEMP/apktool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/apktool.jar" d -f -s artifacts/Readest-Preview-arm64.apk -o "$RUNNER_TEMP/final-apk"
          python3 verify_apk_branding.py "$RUNNER_TEMP/final-apk" > artifacts/branding-verification.txt
          cat artifacts/branding-verification.txt
          # The preview-only debug link must be registered (explicit intents only).
          grep -q 'android:scheme="readest-preview-debug"' "$RUNNER_TEMP/final-apk/AndroidManifest.xml"
          echo "source ${{ env.SOURCE_REPO }}@${{ needs.checks.outputs.sha }}" > artifacts/SOURCE.txt
          cd artifacts && sha256sum Readest-Preview-arm64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Readest-Preview-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/preview.jks" source/apps/readest-app/src-tauri/gen/android/keystore.properties
